<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星座盤</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#222;--muted:#777;--field:#fff;--line:#ddd;--cell:#f7f5f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#202228;--ink:#eee;--muted:#9aa;--field:#2a2d35;--line:#444;--cell:#2a2d35}}
:root[data-theme="dark"]{--bg:#15161a;--card:#202228;--ink:#eee;--muted:#9aa;--field:#2a2d35;--line:#444;--cell:#2a2d35}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
header{padding:16px 18px 8px;max-width:1000px;margin:auto}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px;max-width:1000px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 3px 16px #0000000b}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,button,select{font:inherit}
input[type=date],input[type=time],select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
button{border:0;border-radius:10px;padding:9px 12px;background:#444;color:#fff}
.buttons{display:flex;gap:6px;align-items:end}.buttons button{flex:1;padding:9px 4px;font-size:13px}
.wrap{padding:0 14px 24px;max-width:1000px;margin:auto}
.sky{position:relative;width:min(100%,760px);aspect-ratio:1;margin:8px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.sky canvas{width:100%;height:100%;display:block}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.info div{background:var(--cell);border-radius:10px;padding:9px;font-size:13px}
.legend{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
.manual-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.manual-title span{font-size:11px;color:var(--muted)}
.manual-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.manual-buttons button{font-size:12px;padding:8px 2px}
.table-wrap{overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.small{font-size:11px;color:var(--muted);margin-top:6px}
@media(min-width:800px){.controls{grid-template-columns:repeat(4,1fr)}.info{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.manual-title{display:block}.manual-title span{display:block;margin-top:3px}}
</style>
</head>
<body>
<header><h1>星座盤</h1><div class="sub">你提供的「簡易星座盤」：星座圓盤在底，外框開橢圓窗。轉動圓盤，把日期對準時間。（北緯 25°）</div></header>

<section class="controls">
  <div class="card"><label>日期</label><input id="date" type="date"></div>
  <div class="card"><label>時間（臺灣時間）</label><input id="time" type="time"></div>
  <div class="card"><label>面向方向（該方位轉到下方）</label><select id="dir"><option value="S">南</option><option value="E">東</option><option value="N">北</option><option value="W">西</option></select></div>
  <div class="card buttons"><button id="now">現在</button><button id="lock">固定</button></div>
</section>

<div class="wrap">
  <div class="card">
    <div class="manual-title"><b>星盤</b><span>拖曳圓盤外圈（月日刻度）＝改日期　拖曳其他處＝轉盤改時間</span></div>
    <div class="sky" id="sky"><canvas id="c"></canvas></div>
    <div class="manual-buttons">
      <button data-min="-60">← 1小時</button><button data-min="-10">← 10分</button><button data-min="10">10分 →</button><button data-min="60">1小時 →</button>
    </div>
    <div class="legend">橢圓窗內是此刻的天空，× 是北天極。粉紅線對準外框的時間，同時指到圓盤外緣的日期。輸入日期與時間後按「固定」，畫面就不會被手指誤動；再輸入時間或按「現在」即可解除。<br><span style="color:#e6b800">■ 黃：黃道十二星座、蛇夫座</span>　<span style="color:#a066ee">■ 紫：春季大鑽石、夏季大三角、秋季四邊形、冬季大橢圓</span>　<span style="color:#e53b3b">■ 紅：北極星</span>　<span style="color:#3b8cff">■ 藍：銀河</span></div>
  </div>

  <div class="card table-wrap">
    <b>亮星資料</b>
    <table><thead><tr><th>排名</th><th>名稱</th><th>星座</th><th>星等</th><th>距離</th><th>顏色</th><th>光譜型</th></tr></thead><tbody id="stars"></tbody></table>
    <div class="small">資料與星座盤圖版：臺北市立天文科學教育館免費提供（2025.09 版）。</div>
  </div>
</div>

function setNow(){const n=new Date(Date.now()+288e5);dayF=Math.floor(n/864e5)-BASE;tmin=(n%864e5)/6e4}
function start(){const n=new Date(Date.now()+288e5);dayF=Math.floor(n/864e5)-BASE;tmin=1200}
const Dval=()=>L0+K*(dayF+tmin/1440)+tmin/4;      // 地方恆星時（度）
function wrap(){while(tmin>=1440){tmin-=1440;dayF++}while(tmin<0){tmin+=1440;dayF--}}
function sunPos(){
  const d=dayF+tmin/1440-0.83333,L=280.460+0.9856474*d,g=(357.528+0.9856003*d)*RAD;
  const lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*RAD,e=23.439*RAD;
  return{ra:Math.atan2(Math.cos(e)*Math.sin(lam),Math.cos(lam))/RAD,dec:Math.asin(Math.sin(e)*Math.sin(lam))/RAD};
}
function resize(){const d=devicePixelRatio||1;W=sky.clientWidth;cv.width=W*d;cv.height=W*d;ctx.setTransform(d,0,0,d,0,0);draw()}
addEventListener('resize',resize);
const sc=()=>W/1760*zoom;
function vc(){if(zoom===1)return[0,0];const r=ROT[$('dir').value];return[-300*Math.sin(r),300*Math.cos(r)]}
const P=(r,a)=>[r*Math.cos(a*RAD),-r*Math.sin(a*RAD)];

function draw(){
  if(loaded<2)return;
  const D=Dval(),rho=D-180,[vx,vy]=vc();
  ctx.save();ctx.clearRect(0,0,W,W);
  ctx.translate(W/2,W/2);ctx.scale(sc(),sc());ctx.translate(-vx,-vy);ctx.rotate(ROT[$('dir').value]);
  // 星座圓盤（隨恆星時旋轉；赤經 0h 在圖上方，LST 對準正南＝下方）
  ctx.save();ctx.beginPath();ctx.rect(-900,-900,1800,900+790);ctx.clip();
  ctx.rotate(-rho*RAD);ctx.drawImage(disc,-DSZ/2,-DSZ/2,DSZ,DSZ);ctx.restore();
  // 外框
  ctx.drawImage(frame,-PX,-PY);
  // 時間指示線（午夜在上，順時針…逆時針遞增）
  const a=-90+(tmin-720)/4,[x1,y1]=P(560,a),[x2,y2]=P(865,a);
  ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#fff";ctx.lineWidth=9;ctx.stroke();
  ctx.strokeStyle="#ff2d95";ctx.lineWidth=4.5;ctx.stroke();
  ctx.restore();
  const dt=new Date((Math.round(dayF)+BASE)*864e5),m=Math.round(tmin)%1440;
  const ds=dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
  const ts=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  if(document.activeElement!==$('date'))$('date').value=ds;
  if(document.activeElement!==$('time'))$('time').value=ts;
}
$('date').onchange=e=>{if(e.target.value){setLock(false);const[y,mo,d]=e.target.value.split("-").map(Number);dayF=Date.UTC(y,mo-1,d)/864e5-BASE;draw()}};
$('time').onchange=e=>{if(e.target.value){setLock(false);const[h,m]=e.target.value.split(":").map(Number);tmin=h*60+m;draw()}};
$('dir').onchange=draw;
function setLock(v){locked=v;const b=$('lock');b.textContent=v?"已固定":"固定";b.style.background=v?"#d6458f":"";sky.style.cursor=v?"not-allowed":""}
$('lock').onclick=()=>setLock(!locked);
$('now').onclick=()=>{setNow();setLock(false);draw()};
document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{setLock(false);tmin+=Number(b.dataset.min);wrap();draw()});

let drag=false,mode="",last=0;
function world(e){const r=sky.getBoundingClientRect(),[vx,vy]=vc(),k=sc(),f=W/r.width;return[(e.clientX-r.left)*f/k-W/2/k+vx,(e.clientY-r.top)*f/k-W/2/k+vy]}
const ang=([x,y])=>Math.atan2(-y,x)/RAD;
sky.addEventListener('pointerdown',e=>{if(locked)return;const w=world(e);mode=Math.hypot(w[0],w[1])>RING?"date":"time";drag=true;last=ang(w);sky.setPointerCapture(e.pointerId)});
sky.addEventListener('pointermove',e=>{if(!drag)return;const w=world(e),a=ang(w);let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;
  if(mode==="date")dayF+=d/K;else{tmin+=d/.250684;wrap()}draw()});
const end=()=>{if(drag&&mode==="date")dayF=Math.round(dayF);drag=false;draw()};
sky.addEventListener('pointerup',end);sky.addEventListener('pointercancel',end);
start();resize();
</script>
